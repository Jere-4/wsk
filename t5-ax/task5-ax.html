<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant list</title>
    <link rel="stylesheet" href="task5-ax.css" />
    <script src="task5-ax.js" defer></script>
  </head>

  <body>
    <h1>Restaurants</h1>
    <table id="restaurant-table">
      <tr>
        <th>Name</th>
        <th>Address</th>
      </tr>
    </table>

    <dialog id="restaurant-dialog">
      <h2 id="dialog-name"></h2>
      <p><strong>Address:</strong> <span id="dialog-address"></span></p>
      <p><strong>Postal Code:</strong> <span id="dialog-postal"></span></p>
      <p><strong>City:</strong> <span id="dialog-city"></span></p>
      <p><strong>Phone:</strong> <span id="dialog-phone"></span></p>
      <p><strong>Company:</strong> <span id="dialog-company"></span></p>
      <button id="close-dialog">Close</button>
    </dialog>
  </body>
</html>
